name: Fetch Sessionize Data

on:
  # Weekly schedule is DISABLED for the 2027 cycle.
  # The SESSIONIZE_EVENT_ID secret still points at the 2026 event, so an
  # automatic run would overwrite src/data/sessionize.json with last year's
  # speakers and sessions. Re-enable once the secret points at the 2027 event.
  # schedule:
  #   # Run weekly at 12:00 AM EST on Sunday (5:00 AM UTC on Sunday)
  #   - cron: '0 5 * * 0'
  workflow_dispatch: # Manual triggers only

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Sessionize Data
        env:
          SESSIONIZE_EVENT_ID: ${{ secrets.SESSIONIZE_EVENT_ID }}
        run: node scripts/fetch-sessionize.js

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code src/data/sessionize.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/sessionize.json
          git commit -m "chore: update Sessionize data [skip ci]"
          git push
